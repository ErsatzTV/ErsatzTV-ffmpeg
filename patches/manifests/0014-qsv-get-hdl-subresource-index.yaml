id: qsv-get-hdl-subresource-index
patch: 0014-qsv-set-the-subresource-index-for-individual-textures-in-get_hdl.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  # Not reported. The three get_hdl callbacks (libavutil/hwcontext_qsv.c
  # frame_get_hdl, libavfilter/qsvvpp.c frame_get_hdl, libavcodec/qsv.c
  # qsv_frame_get_hdl) are unchanged in origin/master as of 2026-09-28.
  commits: []
dependencies:
  - d3d11va-render-target-array   # 0003 is what makes render-target pools
                                  # individual textures (MFX_INFINITE index).
                                  # Arrays are not an alternative: they fail
                                  # with E_INVALIDARG on Haswell too.
platforms:
  - windows-qsv               # legacy Media SDK runtime; verified on API 1.20
reproducer: tests/qsv-get-hdl-subresource-index.sh
samples: []                   # synthetic lavfi sources; the bug is in how
                              # surfaces are handed to the runtime
failure_without_patch:
  - "[Parsed_vpp_qsv_N] Error running VPP: device failed (-17)"
  - "[Parsed_overlay_qsv_N] Error running VPP: device failed (-17)"
success_with_patch:
  - "VPP (scale, format conversion, pad, overlay_qsv) runs on surfaces from
     hwupload and vpp_qsv output pools"
notes:
  - "MECHANISM: hwcontext_qsv builds an mfxHDLPair per surface. For a
     render-target pool (hwupload, vpp_qsv output) the textures are individual,
     so the pair's index is MFX_INFINITE. The get_hdl callbacks copy the
     texture and write the index only when it is not MFX_INFINITE, so for
     these surfaces the index half of the output pair keeps whatever the
     runtime had in it. The API 1.20 runtime on Haswell uses it as the D3D11
     subresource index and fails the VPP run with MFX_ERR_DEVICE_FAILED. The
     patch writes 0 instead, the index hwcontext_qsv already uses for
     MFX_INFINITE when it maps these surfaces back to d3d11va."
  - "SCOPE: VPP whose input is a hwupload or VPP output surface. The encoder
     accepts the same surfaces, and VPP on decoder surfaces (array textures
     with real indexes) works, which is why decode -> vpp_qsv -> encode and
     a scale+pad fused into one vpp_qsv pass worked without the patch while a
     second vpp_qsv, overlay_qsv, or VPP after hwupload did not."
  - "REACHABILITY: these runtimes also need the libvpl dispatcher patch in
     native/FFmpeg-Builds (patches/libvpl) when the Intel GPU is not the
     primary adapter or the runtime reports no device ID. Without it
     -init_hw_device qsv fails with MFX_ERR_NOT_FOUND (-9) and the reproducer
     skips every case."
  - "LINUX: VA-API pools also use MFX_INFINITE for the index, so this changes
     the pair Linux runtimes receive (index 0 instead of an untouched field).
     On Arc with vpl-gpu-rt the reproducer and the ErsatzTV next qsv suite
     pass with and without the patch (see last_verified), so the change is
     harmless there. Not run on a legacy libmfx runtime on Linux."
  - "NOT VERIFIED: a oneVPL 2.x runtime on Windows (TGL and newer, Arc), where
     0 is the correct subresource of an individual texture."
  - "ErsatzTV next reports it as the 4 canvas cases in the qsv suite on an
     HD 4600 (overlay_qsv of the canvas), which pass with the patch."
last_verified:
  version: n8.1.2
  date: 2026-09-28
  builds:
    without_patch: n8.1.2-etv.dev.vplpatch  # win64 local build, patches 0001-0013 + patched libvpl
                                            # (no CI build has the libvpl patch without this one)
    without_patch_linux: n8.1.2-etv.dev.cb938dc6  # linux64 CI build, patches 0001-0013
    with_patch: n8.1.2-etv.dev.6a76717b     # win64 and linux64 CI builds (main, #56)
  how: >-
    Intel HD Graphics 4600 (Haswell, 8086:0412), Windows 11, driver
    20.19.15.5171, legacy Media SDK runtime API 1.20, D3D11. DXGI adapter 2
    (AMD WX 3200 and NVIDIA P620 also installed).
    tests/qsv-get-hdl-subresource-index.sh: without the patch all 4 cases fail
    with "device failed (-17)"; with the patch all 4 pass. n8.1.2-etv.1 skips
    all 4 (-init_hw_device qsv fails, unpatched libvpl).
    ErsatzTV next qsv suite (--test-threads 1) with the patch: the 4 canvas
    cases pass; 155/264 overall. 104 of the failures are 10-bit hwupload
    ("Failed to upload frame"), which next's probe must stop routing to QSV
    on this runtime; the other 5 are the known intermittent hwdownload
    "Error synchronizing the operation: -17" (1 failure in 20 reruns).
    Arc A750 (8086:56a1), Arch Linux, i915, vpl-gpu-rt 26.2.4 (libvpl
    2.17): the reproducer passes all 4 cases and the ErsatzTV next qsv suite
    (--test-threads 1) passes 264/264, on both the linux64 build without the
    patch and the one with it.
remove_when: >-
  Upstream get_hdl callbacks always write the index half of the pair, or the
  legacy runtimes this exists for are no longer supported.
