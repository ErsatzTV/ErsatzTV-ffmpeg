id: vf-libplacebo-nv12-output
patch: 0024-avfilter-vf_libplacebo-add-nv12_output-option.patch
based_on: n8.1.2
status: experimental-opt-in
upstream:
  issue: null
  # Depends on a local libplacebo API (patches/libplacebo/0001); not proposed to FFmpeg.
  commits: []
dependencies:
  - 0023-avutil-vulkan-direct-nv12-opt-in.patch   # writable VAAPI NV12 target
  - libplacebo/0001-nv12-direct-output-match.patch # compile-time: PL_RENDERER_NV12_OUTPUT
platforms:
  - linux-vaapi-vulkan
failure_without_patch:
  - "No way to select the single-pass NV12 output; the VAAPI tone-mapping chain renders RGBA and converts it with scale_vulkan in a second pass."
success_with_patch:
  - "nv12_output=match with format=nv12:range=tv renders the reverse-mapped NV12 surface in one pass; raw NV12 output is byte-identical to the RGBA + scale_vulkan route on the tested Intel system."
notes:
  - "The option is compiled in only when libplacebo defines PL_RENDERER_NV12_OUTPUT, so its presence in `ffmpeg -h filter=libplacebo` means the implementation is present."
  - "Per filter instance (pl_renderer_set_nv12_output on each renderer); default off keeps current behavior. Targets that do not qualify keep libplacebo's normal output path."
  - "Measurements and scope: docs/nv12-match.md."
last_verified:
  version: n8.1.2
  date: 2026-10-26
  how: >-
    Packaged amd64 image (main + 0023 + this patch, DIRECT_NV12_OUTPUT=1) on an
    Intel i3-1220P (Gen12, ANV/iHD, Mesa 25.2.8): option listed; raw NV12 equal
    to the RGBA route on 1080p/720p fixtures and 2160p HDR10/DV8 sources. Built
    with DIRECT_NV12_OUTPUT=0: option absent.
remove_when: "libplacebo or FFmpeg provides a single-pass NV12 output that matches scale_vulkan, or the RGBA route is retired."
