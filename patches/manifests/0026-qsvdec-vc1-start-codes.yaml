id: qsvdec-vc1-start-codes
patch: 0026-avcodec-qsvdec-add-vc1-start-codes.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  # Not reported. qsvdec.c in origin/master (58584087cf) passes VC-1 packets
  # to the runtime as they are, and there is no VC-1 bsf.
  commits: []
dependencies: []              # context overlaps 0025; applies after it
platforms:
  - linux-qsv
  - windows-qsv
reproducer: tests/qsvdec-vc1-start-codes.sh
samples:
  - samples/vc1-320x240-bare-frames.mkv   # samples/make-vc1-bare-frames.py, from FATE vc1/SA00050.vc1
  - samples/vc1-320x240-start-codes.mkv   # samples/make-vc1-bare-frames.py
failure_without_patch:
  - "[vc1_qsv] video_get_buffer: image parameters invalid (every packet)"
  - "reproducer bare: FAIL, no sequence header (start_codes passes)"
success_with_patch:
  - "reproducer bare and start_codes: 30 frames each, bit-exact with software"
notes:
  - "MECHANISM: ASF stores VC-1 Advanced (WVC1) frames without a frame start
     code and keeps the sequence header and entry point only in the
     extradata, after one leading byte. qsvdec passed packets to
     MFXVideoDECODE_DecodeHeader as they are and never passed the extradata,
     so the runtime never found a sequence header ('More data is required to
     decode header'). reinit_fail then left pix_fmt at NONE, and every later
     packet failed get_buffer's check."
  - "The patch rewrites such packets to the layout of a VC-1 elementary
     stream: the sequence header and entry point from the extradata (from
     its first start code) before the first packet after init or flush and
     before every keyframe, and 00 00 01 0D before the frame. Packets that
     already start with a start code (Blu-ray VC-1 in Matroska or MPEG-TS,
     which carry the header in-band on keyframes) are unchanged."
  - "Both parts are needed. With the header in front of the bare frames but
     no 0D start code (dump_extra on the ASF stream), the unpatched decoder
     segfaults (rc 139). The patched one doesn't treat that layout as start
     codes, since the packet begins with the extradata's leading byte; the
     runtime returns MFX_ERR_UNDEFINED_BEHAVIOR for every packet and then
     MFX_WRN_DEVICE_BUSY forever, and qsvdec's unbounded DEVICE_BUSY retry
     (upstream) never exits, even on SIGTERM. Not a layout a demuxer produces;
     the retry loop is a separate problem."
  - "Matroska that was remuxed from ASF keeps the bare packets and fails the
     same way, so the sample is Matroska. ffmpeg has no VC-1 encoder and its
     muxers keep start codes, so the generator writes the file by hand."
  - "WMV3 (VC-1 Simple/Main) has no QSV decoder in FFmpeg and is unaffected."
  - "ASF packets carry dts but no pts. qsvdec passes only pts to the runtime,
     so without -fflags +genpts the frames get made-up timestamps (from 0 at
     ~30 fps for a 59.94 fps stream) and -ss can't trim them. Not changed by
     this patch (packet props are copied); with +genpts, which ErsatzTV next
     always sets, QSV matches software. A separate qsvdec issue."
  - "The flush re-arm is covered by a seek, not by the reproducer: the samples
     have one keyframe."
  - "Found with a WVC1 .wmv clip in ErsatzTV next's external media suite:
     QSV decoded nothing on Intel UHD 620 (Linux) and N150 graphics (Windows);
     software and VAAPI passed."
last_verified:
  version: n8.1.2
  date: 2026-10-27
  builds:
    without_patch: n8.1.2-etv.dev.815ab3af   # CI build of #84's head; same tree as main 9cfc257
    with_patch: n8.1.2-etv.dev.0026dec1      # local linux64 build of main 9cfc257 + this patch
  how: >-
    tests/qsvdec-vc1-start-codes.sh on Intel UHD 620 (KBL, 8086:5917), Debian
    13, iHD 25.2.3, libmfx1 22.5.4, libvpl 2.14.0: the unpatched build fails
    bare and passes start_codes; the patched build passes both (30 frames,
    bit-exact). Arc A750 (DG2, no VC-1 decode): both cases skip. A 720p59.94
    WVC1 .wmv clip: unpatched 0 frames; patched 2790 of 2790,
    bit-exact with software by frame index; with +genpts and -ss 7, 2417 of
    2417 bit-exact with software. Blu-ray VC-1 in Matroska (two clips,
    1094 and 1799 frames): QSV output identical with and without the patch.
remove_when: "Upstream qsvdec gives the runtime VC-1 start codes and the extradata header"
