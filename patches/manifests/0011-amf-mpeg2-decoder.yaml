id: amf-mpeg2-decoder
patch: 0011-lavc-amfdec-add-mpeg2_amf-decoder.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  commits: []
  # Not reported. amfdec.c in FFmpeg master (2026-09-16) still wraps only the
  # H.264, HEVC, VP9 and AV1 components even though the AMF SDK has exposed
  # AMFVideoDecoderUVD_MPEG2 since 1.4. Verified on real hardware and
  # upstreamable as is.
dependencies: []
platforms:
  - windows-amf               # amfdec.c is built wherever --enable-amf is, so
  - linux-amf                 # the Linux amdgpu-pro runtime is in scope too
reproducer: tests/amf-mpeg2-decoder.sh
samples: []                   # synthetic MPEG-2 from lavfi
failure_without_patch:
  - "'mpeg2_amf' is absent from ffmpeg -decoders"
  - "-hwaccel amf on an mpeg2video input decodes in SOFTWARE with no warning: the
     verbose log never prints \"Selecting decoder 'mpeg2_amf'\" and vpp_amf uploads
     the system frames itself, so the run succeeds and looks accelerated"
  - "reproducer case decoder-listed fails, and mpeg2-progressive / mpeg2-interlaced
     fail on the missing decoder selection line; exit 1"
success_with_patch:
  - "ffmpeg -decoders lists mpeg2_amf and not vc1_amf"
  - "-hwaccel amf on mpeg2video logs \"Selecting decoder 'mpeg2_amf'\" and decodes
     every frame on the device; reproducer exits 0"
  - "on an AMD adapter without MPEG-2 hardware the decoder init fails with
     'AMF has no hardware decoder for AMFVideoDecoderUVD_MPEG2 on this device'
     (rc=1) instead of crashing; reproducer case unsupported-gpu passes"
notes:
  - "MECHANISM: -hwaccel amf works by swapping the native decoder for the
     <codec>_amf wrapper (ffmpeg_dec.c), so a codec without a wrapper silently
     stays in software. amfdec.c is codec-agnostic apart from the switch that maps
     AVCodecID to an AMF component id and the DEFINE_AMF_DECODER list; the patch
     adds MPEG2VIDEO -> AMFVideoDecoderUVD_MPEG2 to both, plus the usual
     configure/allcodecs/Makefile registration."
  - "HARDWARE SUPPORT IS PER GPU, not per driver. Measured with the AMF SDK caps
     query (ErsatzTV next, probe_capabilities amf --adapter N) on runtime 1.4.37:
       RX 6600M (RDNA2, VCN 3.0):   MPEG2 hardware NV12 <= 1920x1080
       Radeon 680M (Rembrandt APU): MPEG2 GetCaps fails (no such hardware)
     AMD dropped MPEG-2 decode from the newer VCN blocks, so RDNA3 and later
     will match the 680M. The ErsatzTV probe only advertises the decoder when the
     component reports caps, and only when ffmpeg -decoders lists mpeg2_amf, so
     an unpatched or unsupported build falls back to software decode by design."
  - "UNSUPPORTED-GPU CRASH (found on the g6a8e4827 build, guarded since): on the
     680M the runtime still CREATES the MPEG-2 component and Init() succeeds,
     then the first SubmitInput() returns AMF_NOT_SUPPORTED (10) and ffmpeg
     segfaults on the way out (rc 139). There is no software fallback once
     -hwaccel amf has selected the wrapper, so the patch calls GetCaps() right
     after CreateComponent() and fails init with ENOSYS when the caps are missing
     or report AMF_ACCEL_NOT_SUPPORTED. That mirrors the check the ErsatzTV probe
     uses to decide support in the first place. The guard is deliberately limited
     to MPEG-2 so stock codec behaviour is unchanged."
  - "INTERLACED MPEG-2 (most broadcast/DVD sources) should be downloaded right
     after decode, the same workaround ErsatzTV applies to interlaced H.264 on AMF:
     the decoder stamps field-pair surfaces and h264_amf then switches into an
     interlaced scan mode that stalls. The reproducer's mpeg2-interlaced case uses
     hwdownload + bwdif for that reason; do not 'fix' it to stay on the device."
  - "VC-1 IS DELIBERATELY NOT WRAPPED. Earlier versions of this patch also added
     vc1_amf. Its pictures are correct, but the AMF runtime stamps each picture
     with the pts of the packet that carried it, and MKV stores VC-1 timestamps in
     decode order, so output pts swap in pairs (ASF sources were fine). Because
     -hwaccel amf swaps in any <codec>_amf wrapper, carrying vc1_amf made VC-1
     from MKV judder under -hwaccel amf (cfr encode: about half the frames
     duplicated or dropped) where stock ffmpeg stays on the correct software
     decoder. ErsatzTV never selected it, so it was removed. decoder-listed fails
     if vc1_amf reappears."
  - "No bitstream filter is attached. MPEG-2 packets are already an elementary
     stream; extradata (MP4/MKV sequence header) goes through the existing
     AMF_VIDEO_DECODER_EXTRADATA path."
  - "MPEG-1 is not mapped. The DXVA MPEG2and1 profile suggests the hardware could
     take it, but the AMF component id says MPEG2 and nothing here verifies MPEG-1."
last_verified:
  version: n8.1.2
  date: 2026-09-27
  builds:
    without_patch: n8.1.2-20260907-etv-g14f231eb
    with_patch:    n8.1.2-20260916-etv-g6a8e4827   # decoder mapping only; the
                                                   # GetCaps guard is NOT in this
                                                   # build
    release:       n8.1.2-etv.1                    # release 8.1.2-1, carries the
                                                   # guard; unsupported-gpu still
                                                   # not run against it
  how: >-
    These runs predate the VC-1 removal; the MPEG-2 code is unchanged apart from
    the guard's condition and comment. Reproducer on the RX 6600M
    (INIT_HW_DEVICE="-init_hw_device d3d11va=dx:1 -init_hw_device amf=hw@dx"):
    decoder-listed, mpeg2-progressive and mpeg2-interlaced all pass, 60/60
    frames each, exit 0. MPEG-2 decode correctness checked against the native
    mpeg2video decoder on 3 s testsrc2 clips encoded with B-frames (-bf 2 -g
    15): 90 frames out of both decoders, per-frame PSNR of mpeg2_amf vs software
    is min 69.98 / avg 71.88 dB for progressive and min 48.00 / avg 59.11 dB for
    interlaced (tff); output pts monotonic and identical to software from TS,
    MKV, VOB and MP4 containers. ErsatzTV next's AMF integration tests
    (deinterlace group, 22 cases incl. the new 480i_mpeg2.ts fixture) pass with
    ETV_TEST_FFMPEG pointed at this build, and the generated command for the
    MPEG-2 case carries -hwaccel amf on d3d11va=dx:1 followed by hwdownload. On
    the 680M (dx:0) and on the runtime-default device the g6a8e4827 build
    segfaults after "SubmitInput() returned error 10" (rc 139), which is what
    prompted the GetCaps guard. Stock 8.1.2 (g14f231eb): decoder-listed fails,
    both mpeg2 cases fail on the missing decoder selection line, exit 1.
    2026-09-27, Radeon Pro WX 3200 (Polaris, driver 31.0.21924.61), Windows 11,
    INIT_HW_DEVICE="-init_hw_device d3d11va=dx:0 -init_hw_device amf=hw@dx":
    release 8.1.2-1 win64 zip (SHA256SUMS verified) passes decoder-listed,
    mpeg2-progressive and mpeg2-interlaced (60/60 frames each), exit 0; stock
    BtbN n8.1.2-50-g1a748fe2cd-20260831 fails all three, exit 1. No MPEG-2-less
    AMD adapter on that host, so unsupported-gpu was skipped.
remove_when: >-
  Upstream amfdec.c registers mpeg2_amf itself, i.e. the decoder-listed case
  passes on a stock build of the pinned version.
