id: readrate-sparse-stream-stall
patch: 0007-ffmpeg_demux-do-not-pace-readrate-on-sparse-streams.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  commits: []
  # Bug is present verbatim in FFmpeg master as of 2026-08-19. The upstream
  # readrate rework backported by 0006 (dba917bab5 / de6bcf5c05) fixed the
  # per-stream av_usleep() loop but still selects the slowest stream by
  # minimum dts progress, which is always the sparse one. Not yet reported.
dependencies:
  - readrate-slowest-stream   # 0007 rewrites the selection loop 0006 introduces
platforms:
  - all                       # fftools demuxer logic; no platform or hwaccel involvement
reproducer: tests/readrate-sparse-stream-stall.sh
samples:
  - path: samples/dvdsub-sparse-gaps-h264.mkv
    sha256: "deec0b63a4792b9b94cc368e310b656d45c4418b2d15e5b1ff29552d2221a8a6"
    # Fully synthetic, generated by samples/make-dvdsub-sparse-gaps.py: 30s of
    # 320x240 smptebars plus a hand-built VobSub dvd_subtitle track (8 box cues,
    # one 15s gap 7.0 -> 22.0). Only the cue timing matters to the bug. Replaced
    # the original report-derived sample on 2026-09-26; re-verified then with
    # master N-124254-g397c7c7524 (15.00s stall, exit 1) and
    # n8.1.2-etv-g14f231eb (0.53s, exit 0).
failure_without_patch:
  - "demuxer stalls ~15s in a single av_usleep() at media ~21.4 (subtitle gap 7.0 -> 22.0)"
  - "reproducer reports max stall >= 5s and exits 1"
success_with_patch:
  - "output media time advances continuously at ~1.05x"
  - "reproducer reports max stall < 5s and exits 0"
notes:
  - "Symptom in ErsatzTV: HLS segmenter starves whenever a channel burns in an
     image-based subtitle track, because the demuxer thread sleeps for the
     length of each inter-subtitle gap and stalls video and audio with it."
  - "-readrate_catchup does not mitigate this; tested at 1000, stalls remain."
  - "Workaround without a rebuild: demux the subtitle from a second -i of the
     same file that has no -readrate, so the throttled input is video/audio only."
last_verified:
  version: n8.1.2
  date: 2026-08-19
  builds:
    without_patch: n8.1.2-20260813-etv-g25d21b2c   # 0006 only
    with_patch:    n8.1.2-20260819-etv-g3c0520f9   # 0006 + 0007
  how: >-
    Reproducer: 14.00s stall / exit 1 without the patch, 0.51s / exit 0 with it.
    Pacing still tracks readrate (ratio converges to 1.048 over 90s, linear, no
    free-running). strace of clock_nanosleep: longest single sleep drops from
    41.751s to 0.038s, with zero sleeps >= 1s. Full ErsatzTV vaapi pipeline
    (two inputs, overlay_vaapi burn-in, HLS) on the original 132MB source runs
    120s of media in 116.79s wall with no stall after startup - including the
    42.80s subtitle gap at 111.44 that previously caused a 41.751s freeze.
    Sparse-only fallback confirmed unchanged from the pre-0007 build.
remove_when: "An equivalent upstream fix is present and the unpatched reproducer passes"
