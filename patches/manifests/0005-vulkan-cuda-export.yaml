id: vulkan-cuda-export
patch: 0005-vulkan-cuda-export-fix.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  commits:
    # master only (n9.1-dev) - NOT in release/8.1, n9.0 or n9.0.1 as of
    # 2026-09-27. Together they are the upstream equivalent of this patch.
    - 0baa71b53c  # avutil/hwcontext_vulkan: query the actual image format in
                  # try_export_flags (2026-07-10) - pinfo.format = hwctx->format[0]
    - 63d0237033  # avutil/hwcontext_vulkan: Query export support with the real
                  # image flags (2026-08-07) - pinfo.flags = hwctx->img_flags
  # Upstream queries only format[0]; this patch queries every entry of
  # hwctx->format[] and only enables export if all of them succeed, which is
  # stricter for multi-image frames. Upstream's narrower check is enough for nv12/p010: master
  # N-126905-gb87602a63a passes the reproducer unpatched (see last_verified).
dependencies: []
platforms:
  - windows-cuda              # stock n8.1.2 passes on Linux NVIDIA. The code path
                              # is not Windows-specific, only its failure is; see
                              # the PLATFORM note.
reproducer: tests/vulkan-cuda-export.sh
samples: []                   # synthetic lavfi source uploaded to Vulkan reaches
                              # the same export path as the Vulkan decoder
failure_without_patch:
  - "[CUDA] cu->cuImportExternalMemory(&dst_int->ext_mem[idx], &ext_desc) failed -> CUDA_ERROR_INVALID_VALUE: invalid argument"
  - "[Parsed_hwupload_cuda_N] Error transferring data to the GPU"
  - "ffmpeg then crashes on the error path (0xc0000005 on Windows)"
success_with_patch:
  - "nv12 and p010 Vulkan frames import into CUDA and round-trip bit-exact with the software frames"
notes:
  - "MECHANISM: vulkan_frames_init() picks the per-plane fallback formats
     (R8_UNORM + R8G8_UNORM for nv12, R16 + R16G16 for p010) into hwctx->format[]
     because NVIDIA cannot use the multiplane format as a STORAGE image.
     try_export_flags() then asks GetPhysicalDeviceImageFormatProperties2()
     about the multiplane sw_format VkFormat (with ALIAS_BIT rather than the
     real img_flags), that query fails, no external handle type is set, and the
     memory is allocated non-exportable. vulkan_export_to_cuda() exports it
     anyway and CUDA rejects the handle."
  - "SINGLE-IMAGE FORMATS ARE UNAFFECTED, which is the control: a stock build
     imports bgra into CUDA fine (its format[0] is its sw_format VkFormat), and
     fails later for an unrelated reason - see the next note. That isolates the
     format half of the patch as the trigger. The img_flags half is upstream's
     63d0237033 and could not be isolated without a flags-only build."
  - "OUT OF SCOPE: packed formats (bgra, ...) fail on the patched build too, at
     cuMemcpy2DAsync, because vulkan_export_to_cuda() only computes NumChannels
     for planar/semi-planar layouts. Fixed upstream by 927f205eb8 + b4b30ff8fd
     (master only; bgra imports and copies cleanly on N-126905-gb87602a63a).
     ErsatzTV only hands nv12/p010 to CUDA, so not carried."
  - "PLATFORM: stock n8.1.2 passes on Linux NVIDIA (reported 2026-09-27), so
     the failure is Windows-only in practice. The code is not: try_export_flags()
     makes the same wrong query on Linux, with OPAQUE_FD instead of
     OPAQUE_WIN32. The difference is presumably the NVIDIA Linux driver
     accepting GetMemoryFdKHR on memory that was not allocated exportable
     (invalid usage per spec) and handing CUDA a usable fd - inferred, not
     traced. The reproducer is therefore only
     meaningful on Windows; on Linux it passes with or without the patch and
     proves nothing. Upstream's 0baa71b53c reports the bug as 'broken CUDA
     hwaccel output' from ffplay rather than an error, so some driver somewhere
     corrupts instead of failing - the reproducer's bit-exact check covers that."
  - "Reached in ErsatzTV by the CUDA HDR tonemap pipeline: -hwaccel vulkan,
     libplacebo=...:format=nv12, then hwupload_cuda into nvenc
     (ErsatzTV/next ffpipeline tests/cuda.rs tonemap_hdr)."
  - "The patch file is a plain diff with no From:/Subject: header, unlike
     0008-0010. Kept as-is; the manifest is the description."
last_verified:
  version: n8.1.2, master N-126905-gb87602a63a
  date: 2026-09-27
  builds:
    without_patch: n8.1.2-50-g1a748fe2cd-20260831      # stock BtbN 8.1.2
    with_patch:    n8.1.2-etv.1                        # release 8.1.2-1; earlier
                                                       # n8.1.2-20260907-etv-g14f231eb
    upstream_fix:  N-126905-gb87602a63a-20260927       # BtbN master, unpatched
  how: >-
    Quadro P620 (driver 582.78), Windows 11 26100, Vulkan device derived from
    CUDA (vulkan=vk@nv). Reproducer: stock fails all three cases at
    cuImportExternalMemory, exits 1; etv passes all three (nv12 and p010
    bit-exact), exits 0. ErsatzTV/next ffpipeline cuda test
    tonemap_hdr::src_1___1080p_hevc_10_hdr_ts__::res_1___2560x1440__::vf_1____hevc___8_::af_1___aac__
    fails on stock (same cuImportExternalMemory error, ffmpeg exit 0xc0000005)
    and passes on etv. Master passes the reproducer (all three, exit 0) and the
    same decode -> libplacebo -> hwupload_cuda -> scale_cuda chain on the
    1080p_hevc_10_hdr.ts fixture; the ffpipeline test itself fails on master
    only at hevc_nvenc open, because master requires NVENC API 13.1 (driver
    610+) and this host has 582.78. Release 8.1.2-1 win64 zip (SHA256SUMS
    verified) on the same host: reproducer passes all three, exit 0.
remove_when: >-
  The reproducer passes on an unpatched build on a Windows NVIDIA host (a Linux
  pass means nothing, see the PLATFORM note) - expected once the build moves to
  a release containing 0baa71b53c and 63d0237033 (currently master only, so
  FFmpeg 9.1 at the earliest unless backported). On that rebase this patch will
  not apply as-is anyway: 0baa71b53c rewrites the same .format line.
