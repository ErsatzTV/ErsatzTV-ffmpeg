id: vulkan-vaapi-reverse-sync
patch: 0019-avutil-vulkan-vaapi-reverse-sync.patch
based_on: n8.1.2
status: local
upstream:
  issue: null
  commits: []
dependencies: []
platforms:
  - linux-intel-vulkan-vaapi
reproducer: ../docs/vulkan-vaapi-reverse-sync.md
samples: []
failure_without_patch:
  - "Vulkan-filtered frames show displaced image fragments during motion and scene cuts after reverse mapping to VAAPI for encoding"
  - "Encoding and decoding may succeed without errors despite corrupted frame contents"
success_with_patch:
  - "Decoded output matches the synchronized CPU-transfer reference across repeated runs"
notes:
  - >-
    av_hwframe_map returns the original VAAPI frame for a reverse mapping.
    The Vulkan mapping destructor waits at final release, but queued Vulkan
    work can retain that mapping after the original surface is returned to
    the encoder. Wait for the Vulkan frame timeline before exposing the
    VAAPI surface. This does not download or upload pixel data.
  - >-
    Deliberately limited to the Vulkan-to-VAAPI reverse-unmap shortcut.
    Other mapping pairs and forward export paths are unchanged. Waiting
    on the host can reduce overlap; this is a scoped downstream correction,
    not a new public mapping API or a claim of optimal asynchronous interop.
  - >-
    A proposed upstream DRM-import dependency fix (FFmpeg PR25161) did not
    correct this reproduction. This patch is independently implemented,
    not a backport of that proposal. No FFmpeg upstream PR has been opened.
  - >-
    AMD, other Intel generations, non-Linux platforms, and long-running
    multi-channel throughput have not been validated.
last_verified:
  version: n8.1.2
  date: 2026-10-22
  builds:
    without_patch: 8.1.2-etv.5
    with_patch: 8.1.2-etv.5-vulkan-sync.1
  how: >-
    The corrected 8.1.2-5 build used the matching ErsatzTV dependency image,
    release configure options, all patches 0001-0018 and patch 0019.
    Its SHA-256 is fb9e95d25f929cd394071dadc27afe2ff9c9defeacffa5f8de1b27fa8c5d2d95.
    A 12-second moving SD source was decoded with VAAPI, scaled/filtered by
    libplacebo in RGBA, converted to NV12 by scale_vulkan, reverse-mapped to
    VAAPI and encoded as 1080p H264. The CPU-transfer reference had 360 frames.
    Stock 8.1.2-5 matched 4 of 360 decoded native-resolution reference frames;
    the patched run, its repeat and an unthrottled patched run each matched
    all 360 exactly by framemd5. Release 5 timings overlapped build activity
    and are not capacity evidence. In the earlier controlled 8.1.2-4 sample,
    the original GPU path ran at 4.53x real time with corruption, the clean
    CPU-copy workaround at 3.33x, and the clean patched GPU path at 4.77x.
    This demonstrates avoiding the CPU-copy penalty in that short sample,
    not a general speedup over the original GPU path or sustained capacity.
remove_when: >-
  The selected upstream FFmpeg source synchronizes pending Vulkan writes
  before this reverse mapping is returned, and the documented reproduction
  passes on the affected Intel Vulkan/VAAPI stack without this patch.
