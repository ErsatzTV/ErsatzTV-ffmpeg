name: CI

# Builds and tests every docker image and native target without publishing
# anything; releases come only from release.yml on a tag push. A dispatch with
# 'sign' also signs and notarizes the macOS builds as release.yml does, to
# prove the Apple secrets before a tag spends a revision.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarize the macOS builds (main only, nothing is published)
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[no build]') == false
    permissions:
      contents: read
      packages: read
    outputs:
      build: ${{ steps.build.outputs.build }}
    steps:
      - name: Check signing dry run
        if: inputs.sign && github.ref != 'refs/heads/main'
        run: |
          echo "::error::the signing dry run runs on main only"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check release notes
        run: |
          tag=$(jq -r '"\(.ffmpeg.version)-\(.revision)"' release.json)
          [ -f "release-notes/$tag.md" ] || { echo "::error::missing release-notes/$tag.md"; exit 1; }

      # a dispatch always builds; the signing dry run needs the builds
      - name: Detect build inputs
        id: build
        env:
          BASE: ${{ github.event_name != 'workflow_dispatch' && (github.event.pull_request.base.sha || github.event.before) || '' }}
        run: sh scripts/needs-build.sh "$BASE" "$COMMIT" >> "$GITHUB_OUTPUT"

      # full submodule history: the lock check needs fork_commit as an ancestor
      - name: Fetch native toolchain
        run: git submodule update --init

      - name: Check native dependency lock
        run: sh scripts/check-native-lock.sh

      - name: Check upstream and patch stack
        run: sh scripts/check-upstream.sh "$RUNNER_TEMP/upstream"

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check docker dependency lock
        run: sh scripts/check-docker-lock.sh

  docker:
    name: Docker (${{ matrix.name }})
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            os: ubuntu-latest
            test: true
          - name: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
            test: true
    steps:
      - name: Clean tools folder
        run: cd /opt && find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf '{}' ';'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release variables
        run: |
          sh scripts/release-vars.sh "$COMMIT" dev >> "$GITHUB_ENV"
          deps=$(jq -er --arg a "${{ matrix.name }}" '.[$a].image' images/linux/deps.lock.json)
          echo "DEPS_IMAGE=$deps" >> "$GITHUB_ENV"

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # verify-ffmpeg.sh runs as the last Dockerfile step
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/${{ matrix.platform }}/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            DEPS_IMAGE=${{ env.DEPS_IMAGE }}
            FFMPEG_VERSION=${{ env.FFMPEG_VERSION }}
            FFMPEG_SHA256=${{ env.FFMPEG_SHA256 }}
            FFMPEG_EXTRA_VERSION=${{ env.FFMPEG_EXTRA_VERSION }}
          push: false
          load: ${{ matrix.test }}
          tags: ersatztv-ffmpeg:ci

      - name: Readrate regression
        if: matrix.test
        run: |
          docker run --rm --entrypoint bash -v "$PWD/patches:/patches:ro" ersatztv-ffmpeg:ci \
            /patches/tests/readrate-sparse-stream-stall.sh /usr/local/bin/ffmpeg

  native:
    name: Native build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux64, linuxarm64, win64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Free disk space
        run: native/FFmpeg-Builds/util/free_disk_space.sh

      # the fork's release mode, so CI takes the same checked path as release.yml
      - name: Build
        run: sh scripts/build-native.sh ${{ matrix.target }} "$COMMIT" dev

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/FFmpeg-Builds/artifacts/ffmpeg-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-macos:
    name: Native build (${{ matrix.target }})
    needs: preflight
    if: needs.preflight.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosarm64
            os: macos-15
          - target: macos64
            os: macos-15
    env:
      # the image default can change underneath us; the dependency cache key records the build
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # build tools only; build-deps.sh keeps Homebrew libraries out of the link
      - name: Build tools
        run: brew install autoconf automake libtool meson nasm

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "SDK $(xcrun --show-sdk-version)"
          echo "xcode=$(xcodebuild -version | awk 'NR == 2 { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Dependency cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/macos/work/${{ matrix.target }}/prefix
          key: macos-deps-${{ matrix.target }}-xcode-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('native/macos/deps.json', 'native/macos/env.sh', 'native/macos/build-deps.sh') }}

      - name: Build
        run: sh native/macos/build.sh ${{ matrix.target }} "$COMMIT" dev

      # as release.yml
      - name: Import signing certificate
        if: inputs.sign
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign and notarize
        if: inputs.sign
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          set -- native/macos/artifacts/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh native/macos/sign.sh "$1"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/macos/artifacts/ffmpeg-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-macos-test:
    name: Native test (${{ matrix.target }})
    needs: native-macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macosarm64
            os: macos-15
          - target: macos64
            os: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release variables
        run: sh scripts/release-vars.sh "$COMMIT" dev >> "$GITHUB_ENV"

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist

      - name: Check package
        run: |
          set -- dist/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh scripts/check-native-package.sh "$1" "$TARGET" "$FFMPEG_VERSION" "$FFMPEG_EXTRA_VERSION" pkg \
            ${{ inputs.sign && 'signed' || 'unsigned' }}

      - name: Readrate regression
        run: |
          /bin/bash patches/tests/readrate-sparse-stream-stall.sh \
            "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"

  native-test:
    name: Native test (${{ matrix.target }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux64
            os: ubuntu-latest
            readrate: true
          - target: linuxarm64
            os: ubuntu-24.04-arm
            readrate: true
          - target: win64
            os: windows-latest
            readrate: false
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release variables
        run: sh scripts/release-vars.sh "$COMMIT" dev >> "$GITHUB_ENV"

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist

      - name: Check package
        run: |
          set -- dist/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh scripts/check-native-package.sh "$1" "$TARGET" "$FFMPEG_VERSION" "$FFMPEG_EXTRA_VERSION" pkg

      - name: Readrate regression
        if: matrix.readrate
        run: patches/tests/readrate-sparse-stream-stall.sh "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"
