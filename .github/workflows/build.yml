name: Build

# Builds and tests every docker image and native target for ci.yml and
# release.yml. Callers run their own preflight checks first and publish
# afterwards from the uploaded artifacts.
on:
  workflow_call:
    inputs:
      commit:
        description: Full SHA of the ErsatzTV-ffmpeg commit being built
        type: string
        required: true
      mode:
        description: release-vars.sh mode, dev (etv.dev.<commit>) or release (etv.<revision>)
        type: string
        required: true
      image:
        description: Push each platform image by digest to this repository and upload the digests; empty only loads it
        type: string
        default: ''
      version:
        description: org.opencontainers.image.version label of pushed images
        type: string
        default: ''
      sign:
        description: Sign and notarize the macOS builds
        type: boolean
        default: false
      save-cache:
        description: Save the macOS dependency cache on a miss; tag runs can only restore main's entries
        type: boolean
        default: false
      fail-fast:
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    secrets:
      APPLE_DEVELOPER_CERTIFICATE_P12_BASE64:
        required: false
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD:
        required: false
      AC_USERNAME:
        required: false
      AC_PASSWORD:
        required: false

permissions:
  contents: read

env:
  COMMIT: ${{ inputs.commit }}
  MODE: ${{ inputs.mode }}
  IMAGE_NAME: ${{ inputs.image }}

jobs:
  docker:
    name: Docker (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # callers grant these; fork PRs get a read-only token and push nothing
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          - name: amd64
            platform: linux/amd64
            os: ubuntu-latest
            test: true
          - name: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
            test: true
    steps:
      - name: Clean tools folder
        run: cd /opt && find . -maxdepth 1 -mindepth 1 '!' -path ./containerd '!' -path ./actionarchivecache '!' -path ./runner '!' -path ./runner-cache -exec rm -rf '{}' ';'

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release variables
        run: |
          sh scripts/release-vars.sh "$COMMIT" "$MODE" >> "$GITHUB_ENV"
          deps=$(jq -er --arg a "${{ matrix.name }}" '.[$a].image' images/linux/deps.lock.json)
          echo "DEPS_IMAGE=$deps" >> "$GITHUB_ENV"
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # buildx provenance is off so the index holds exactly the platform
      # manifests; provenance comes from actions/attest instead.
      # verify-ffmpeg.sh runs as the last Dockerfile step.
      - name: Build
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./images/${{ matrix.platform }}/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            DEPS_IMAGE=${{ env.DEPS_IMAGE }}
            FFMPEG_VERSION=${{ env.FFMPEG_VERSION }}
            FFMPEG_SHA256=${{ env.FFMPEG_SHA256 }}
            FFMPEG_EXTRA_VERSION=${{ env.FFMPEG_EXTRA_VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=GPL-3.0-or-later
          tags: ${{ inputs.image == '' && 'ersatztv-ffmpeg:ci' || '' }}
          outputs: ${{ inputs.image != '' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', inputs.image) || 'type=docker' }}

      - name: Test image
        if: matrix.test
        env:
          REF: ${{ inputs.image != '' && format('{0}@{1}', inputs.image, steps.build.outputs.digest) || 'ersatztv-ffmpeg:ci' }}
        run: echo "TEST_IMAGE=$REF" >> "$GITHUB_ENV"

      - name: Readrate regression
        if: matrix.test
        run: |
          docker run --rm --entrypoint bash -v "$PWD/patches:/patches:ro" "$TEST_IMAGE" \
            /patches/tests/readrate-sparse-stream-stall.sh /usr/local/bin/ffmpeg

      - name: Sub2video regression
        if: matrix.test
        run: |
          docker run --rm --entrypoint bash -v "$PWD/patches:/patches:ro" "$TEST_IMAGE" \
            /patches/tests/sub2video-heartbeat-burst.sh /usr/local/bin/ffmpeg

      - name: Attest
        if: inputs.image != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Export digest
        if: inputs.image != ''
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.image != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  native:
    name: Native build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        target: [linux64, linuxarm64, win64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space
        run: native/FFmpeg-Builds/util/free_disk_space.sh

      # the fork's release mode in every mode, so CI takes the same checked path as a release
      - name: Build
        run: sh scripts/build-native.sh ${{ matrix.target }} "$COMMIT" "$MODE"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/FFmpeg-Builds/artifacts/ffmpeg-*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

  native-macos:
    name: Native build (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        target: [macosarm64, macos64]
    env:
      TARGET: ${{ matrix.target }}
      # the image default can change underneath us; the dependency cache key records the build
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build tools only; build-deps.sh keeps Homebrew libraries out of the link
      - name: Build tools
        run: brew install autoconf automake libtool meson nasm

      - name: Toolchain
        id: toolchain
        run: |
          xcodebuild -version
          echo "SDK $(xcrun --show-sdk-version)"
          echo "xcode=$(xcodebuild -version | awk 'NR == 2 { print $3 }')" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/macos/work/${{ matrix.target }}/prefix
          key: macos-deps-${{ matrix.target }}-xcode-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('native/macos/deps.json', 'native/macos/env.sh', 'native/macos/build-deps.sh') }}

      - name: Build
        run: sh native/macos/build.sh "$TARGET" "$COMMIT" "$MODE"

      - name: Save dependency cache
        if: inputs.save-cache && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: native/macos/work/${{ matrix.target }}/prefix
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # imported after the build, so no third-party build script runs with the signing keychain
      - name: Import signing certificate
        if: inputs.sign
        uses: Apple-Actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}

      - name: Sign and notarize
        if: inputs.sign
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
        run: |
          set -- native/macos/artifacts/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh native/macos/sign.sh "$1"

      - name: Record toolchain
        env:
          CACHE_KEY: ${{ steps.cache.outputs.cache-primary-key }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          deps="built cold"; [ "$CACHE_HIT" = true ] && deps="restored from cache"
          xcode="$(xcodebuild -version | head -n 1) ($(xcodebuild -version | awk 'NR == 2 { print $3 }'))"
          mkdir -p "$RUNNER_TEMP/toolchain"
          echo "- \`$TARGET\`: $xcode, SDK $(xcrun --show-sdk-version), runner image $ImageOS $ImageVersion, dependency cache \`$CACHE_KEY\` ($deps)" \
            > "$RUNNER_TEMP/toolchain/$TARGET.md"
          cat "$RUNNER_TEMP/toolchain/$TARGET.md"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.target }}
          path: native/macos/artifacts/ffmpeg-*
          if-no-files-found: error
          compression-level: 0
          retention-days: ${{ inputs.retention-days }}

      - name: Upload toolchain
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: toolchain-${{ matrix.target }}
          path: ${{ runner.temp }}/toolchain/${{ matrix.target }}.md
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

  native-macos-test:
    name: Native test (${{ matrix.target }})
    needs: native-macos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          - target: macosarm64
            os: macos-15
          - target: macos64
            os: macos-15-intel
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release variables
        run: sh scripts/release-vars.sh "$COMMIT" "$MODE" >> "$GITHUB_ENV"

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist

      - name: Check package
        run: |
          set -- dist/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh scripts/check-native-package.sh "$1" "$TARGET" "$FFMPEG_VERSION" "$FFMPEG_EXTRA_VERSION" pkg \
            ${{ inputs.sign && 'signed' || 'unsigned' }}

      - name: Readrate regression
        run: |
          /bin/bash patches/tests/readrate-sparse-stream-stall.sh \
            "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"

      - name: Sub2video regression
        run: |
          /bin/bash patches/tests/sub2video-heartbeat-burst.sh \
            "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"

  native-test:
    name: Native test (${{ matrix.target }})
    needs: native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: ${{ inputs.fail-fast }}
      matrix:
        include:
          - target: linux64
            os: ubuntu-latest
            readrate: true
          - target: linuxarm64
            os: ubuntu-24.04-arm
            readrate: true
          - target: win64
            os: windows-latest
            readrate: false
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release variables
        run: sh scripts/release-vars.sh "$COMMIT" "$MODE" >> "$GITHUB_ENV"

      - name: Download
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-${{ matrix.target }}
          path: dist

      - name: Check package
        run: |
          set -- dist/ffmpeg-*
          [ $# -eq 1 ] || { echo "::error::expected one archive, got: $*"; exit 1; }
          sh scripts/check-native-package.sh "$1" "$TARGET" "$FFMPEG_VERSION" "$FFMPEG_EXTRA_VERSION" pkg

      - name: Readrate regression
        if: matrix.readrate
        run: patches/tests/readrate-sparse-stream-stall.sh "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"

      - name: Sub2video regression
        if: matrix.readrate
        run: patches/tests/sub2video-heartbeat-burst.sh "pkg/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$TARGET-gpl-8.1/bin/ffmpeg"
