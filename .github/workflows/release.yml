name: Release

# A pushed 8.1.2-N tag builds, tests and publishes that revision as an
# immutable prerelease. Promotion to :8.1.2/:latest and GitHub "latest" is a
# separate, manual step (README). Published bytes are never rebuilt: a changed
# build is a new revision.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*-[0-9]*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ersatztv/ersatztv-ffmpeg

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # full submodule history: the lock check needs fork_commit as an ancestor
      - name: Fetch native toolchain
        run: git submodule update --init

      - name: Release variables
        run: sh scripts/release-vars.sh "$GITHUB_SHA" release >> "$GITHUB_ENV"

      - name: Check release inputs
        run: |
          [ "$GITHUB_REF_NAME" = "$RELEASE_TAG" ] ||
            { echo "::error::tag $GITHUB_REF_NAME does not match release.json ($RELEASE_TAG)"; exit 1; }
          [ -z "$(git status --porcelain --ignore-submodules=none)" ] ||
            { echo "::error::dirty checkout"; git status; exit 1; }
          [ -f "release-notes/$RELEASE_TAG.md" ] ||
            { echo "::error::missing release-notes/$RELEASE_TAG.md"; exit 1; }

      - name: Check native dependency lock
        run: sh scripts/check-native-lock.sh

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check docker dependency lock
        run: sh scripts/check-docker-lock.sh

      # the fork's etv/* tags are protected by a ruleset; they keep the pinned
      # commit reachable when the fork's branch is rebased onto upstream
      - name: Check fork pin tag
        run: |
          fork=native/FFmpeg-Builds
          git -C "$fork" fetch --no-tags origin "refs/tags/etv/$RELEASE_TAG:refs/tags/etv/$RELEASE_TAG" ||
            { echo "::error::fork has no tag etv/$RELEASE_TAG"; exit 1; }
          have=$(git -C "$fork" rev-parse "etv/$RELEASE_TAG^{commit}")
          want=$(git -C "$fork" rev-parse HEAD)
          [ "$have" = "$want" ] ||
            { echo "::error::fork tag etv/$RELEASE_TAG is $have, submodule is $want"; exit 1; }

      - name: Check upstream and patch stack
        run: sh scripts/check-upstream.sh "$RUNNER_TEMP/upstream"

      # every deps.json tarball still downloads and matches its sha256, before
      # anything builds; the bundle is the macOS GPL corresponding source
      - name: Bundle macOS dependency sources
        run: sh native/macos/source-bundle.sh "$RUNNER_TEMP/ersatztv-ffmpeg-$RELEASE_TAG-macos-deps-src.tar"

      - name: Upload macOS dependency sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-deps-src
          path: ${{ runner.temp }}/ersatztv-ffmpeg-*-macos-deps-src.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      # a fresh run would rebuild into different bytes; only a rerun of the
      # original run's failed publish job may continue a partial publication
      - name: Check nothing is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::release $RELEASE_TAG is already published"; exit 1
          fi
          if docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::$IMAGE_NAME:$RELEASE_TAG exists; rerun the original run's publish job or abandon this revision"; exit 1
          fi

  build:
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      commit: ${{ github.sha }}
      mode: release
      image: ghcr.io/ersatztv/ersatztv-ffmpeg
      version: ${{ github.ref_name }}
      sign: true
      fail-fast: true
      retention-days: 30
    secrets:
      APPLE_DEVELOPER_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
      APPLE_DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
      AC_USERNAME: ${{ secrets.AC_USERNAME }}
      AC_PASSWORD: ${{ secrets.AC_PASSWORD }}

  publish:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch native toolchain
        run: git submodule update --init

      - name: Release variables
        run: sh scripts/release-vars.sh "$GITHUB_SHA" release >> "$GITHUB_ENV"

      - name: Download native builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          merge-multiple: true
          path: dist

      - name: Download macOS dependency sources
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-deps-src
          path: ${{ runner.temp }}/macos-deps-src

      - name: Download macOS toolchains
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: toolchain-*
          merge-multiple: true
          path: ${{ runner.temp }}/toolchain

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Login to container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # A tag left by a partial publication is reused only if it holds exactly
      # these platform images; the fixed tag is never moved.
      - name: Create fixed tag
        id: index
        run: |
          set --
          for f in "$RUNNER_TEMP"/digests/*; do set -- "$@" "$IMAGE_NAME@sha256:${f##*/}"; done
          [ $# -eq 2 ] || { echo "::error::expected 2 platform digests, got $#"; exit 1; }
          want=$(printf '%s\n' "$@" | sed 's/.*@//' | sort)
          if ! docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE_NAME:$RELEASE_TAG" "$@"
          fi
          have=$(docker buildx imagetools inspect --raw "$IMAGE_NAME:$RELEASE_TAG" | jq -r '.manifests[].digest' | sort)
          [ "$have" = "$want" ] || { echo "::error::$IMAGE_NAME:$RELEASE_TAG holds other images:"; echo "$have"; exit 1; }
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{json .Manifest}}' | jq -er .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "### \`$IMAGE_NAME:$RELEASE_TAG@$digest\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Assemble assets
        run: |
          mkdir assets
          for t in linux64 linuxarm64 win64 macos64 macosarm64; do
            ext=tar.xz; [ "$t" = win64 ] && ext=zip
            f="dist/ffmpeg-n$FFMPEG_VERSION-$FFMPEG_EXTRA_VERSION-$t-gpl-8.1.$ext"
            [ -f "$f" ] || { echo "::error::missing $f"; ls dist; exit 1; }
            cp "$f" assets/
          done
          set -- dist/*
          [ $# -eq 5 ] || { echo "::error::unexpected native artifacts: $*"; exit 1; }
          cp "$RUNNER_TEMP/macos-deps-src/ersatztv-ffmpeg-$RELEASE_TAG-macos-deps-src.tar" assets/

          sh scripts/check-upstream.sh "$RUNNER_TEMP/upstream"
          cp "$RUNNER_TEMP/upstream/ffmpeg-$FFMPEG_VERSION.tar.bz2" assets/

          src="ersatztv-ffmpeg-$RELEASE_TAG-src"
          git archive --prefix="$src/" -o "$RUNNER_TEMP/src.tar" "$GITHUB_SHA"
          git -C native/FFmpeg-Builds archive --prefix="$src/native/FFmpeg-Builds/" -o "$RUNNER_TEMP/fork.tar" HEAD
          tar --concatenate -f "$RUNNER_TEMP/src.tar" "$RUNNER_TEMP/fork.tar"
          xz -9 -T0 -c "$RUNNER_TEMP/src.tar" > "assets/$src.tar.xz"

          (cd assets && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" assets/
          cat assets/SHA256SUMS

      - name: Attest assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          sh scripts/release-notes.sh "$INDEX_DIGEST" "$RUNNER_TEMP/toolchain" > "$RUNNER_TEMP/notes.md"

          state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          case "$state" in
            none) gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" ;;
            true) gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/notes.md" ;;
            *) echo "::error::release $RELEASE_TAG is already published"; exit 1 ;;
          esac
          gh release upload "$RELEASE_TAG" assets/* --clobber

          verify="$RUNNER_TEMP/verify"
          gh release download "$RELEASE_TAG" --dir "$verify"
          diff <(cd assets && printf '%s\n' *) <(cd "$verify" && printf '%s\n' *) ||
            { echo "::error::draft assets differ from the assembled set"; exit 1; }
          (cd "$verify" && sha256sum -c SHA256SUMS)

          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
